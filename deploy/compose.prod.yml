# Overlay for the VM: docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d --build
services:
  postgres: { restart: unless-stopped }
  redis: { restart: unless-stopped }
  ingest: { image: us-central1-docker.pkg.dev/teejayproject/steno/app:latest, restart: unless-stopped }
  worker: { image: us-central1-docker.pkg.dev/teejayproject/steno/app:latest, restart: unless-stopped }
  chat: { image: us-central1-docker.pkg.dev/teejayproject/steno/app:latest, restart: unless-stopped }
  grafana:
    restart: unless-stopped
    environment: { GF_SERVER_ROOT_URL: "https://${PUBLIC_HOST}/admin/" }
  caddy:
    image: caddy:2-alpine
    command: caddy run --config /etc/caddy/conf/Caddyfile --adapter caddyfile
    ports: ["80:80", "443:443"]
    environment: { PUBLIC_HOST: "${PUBLIC_HOST}" }
    volumes:
      # the folder, not the file: deploy.sh replaces the file, and a single-file mount keeps the old one
      - ./deploy:/etc/caddy/conf:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on: [chat, grafana]

volumes:
  caddy_data: {}
