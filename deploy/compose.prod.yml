# Overlay for the VM: docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d --build
services:
  postgres: { restart: unless-stopped }
  redis: { restart: unless-stopped }
  ingest: { image: steno-app:prod, restart: unless-stopped }
  worker: { image: steno-app:prod, restart: unless-stopped }
  chat: { image: steno-app:prod, restart: unless-stopped }
  grafana:
    restart: unless-stopped
    environment: { GF_SERVER_ROOT_URL: "https://${PUBLIC_HOST}/admin/" }
  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment: { PUBLIC_HOST: "${PUBLIC_HOST}" }
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
    depends_on: [chat, grafana]

volumes:
  caddy_data: {}
