# Overlay for the VM: docker compose -f docker-compose.yml -f deploy/compose.prod.yml up -d --build
services:
  postgres: { restart: unless-stopped }
  redis: { restart: unless-stopped }
  ingest: { restart: unless-stopped }
  worker: { restart: unless-stopped }
  chat: { restart: unless-stopped }
  grafana:
    restart: unless-stopped
    environment: { GF_SERVER_ROOT_URL: https://${PUBLIC_HOST}/admin/ }
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment: { TUNNEL_TOKEN: ${TUNNEL_TOKEN} }
    restart: unless-stopped
    depends_on: [chat, grafana]
