services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app"], interval: 2s, retries: 30 }

  redis:
    image: redis:7-alpine

  ingest:
    build: .
    command: uvicorn ingest.main:app --host 0.0.0.0 --port 8001
    environment: { REDIS_URL: redis://redis:6379 }
    depends_on: [redis]

  worker:
    build: .
    command: python -m ingest.worker
    environment: { REDIS_URL: redis://redis:6379, DATABASE_URL: postgresql://app:app@postgres:5432/app }
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }

  chat:
    build: .
    command: uvicorn chat.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    environment: { DATABASE_URL: postgresql://app:app@postgres:5432/app, STENO_ENDPOINT: http://ingest:8001/v1/logs }
    depends_on: { postgres: { condition: service_healthy }, ingest: { condition: service_started } }

  grafana:
    image: grafana/grafana-oss:latest
    ports: ["3000:3000"]
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/admin/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: { postgres: { condition: service_healthy } }

volumes:
  pgdata: {}
