<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { font: 15px/1.45 system-ui, sans-serif; color: #1a1a1a; }
  body { margin: 0; display: grid; grid-template-columns: 260px 1fr; height: 100vh; }
  aside { border-right: 1px solid #ddd; overflow-y: auto; padding: 12px; background: #fafafa; }
  aside button { width: 100%; padding: 8px; margin-bottom: 10px; cursor: pointer; }
  aside .conv { padding: 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  aside .conv:hover, aside .conv.active { background: #e6e6e6; }
  main { display: flex; flex-direction: column; }
  #log { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 720px; margin: 0 auto 14px; white-space: pre-wrap; }
  .msg.user { font-weight: 600; }
  .msg.assistant { border-left: 3px solid #999; padding-left: 10px; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ddd; }
  form textarea { flex: 1; resize: none; padding: 8px; font: inherit; }
  form select, form input { padding: 6px; font: inherit; }
  form button { padding: 0 16px; cursor: pointer; }
</style>
</head>
<body>
<aside>
  <button id="new">New conversation</button>
  <div id="list"></div>
</aside>
<main>
  <div id="log"></div>
  <form id="f">
    <select id="provider">
      <option value="google">Gemini</option>
      <option value="groq">gpt-oss-120b (Groq)</option>
      <option value="openai">OpenAI</option>
    </select>
    <input id="model" placeholder="model (default)" size="16">
    <textarea id="text" rows="2" placeholder="Message" required></textarea>
    <button id="send" type="submit">Send</button>
    <button id="stop" type="button" hidden>Stop</button>
  </form>
</main>
<script>
const $ = s => document.querySelector(s);
const api = (p, o) => fetch('/api' + p, o).then(r => r.ok ? r : Promise.reject(r.statusText));
let current = null, ctrl = null;

function bubble(role, text = '') {
  const d = document.createElement('div');
  d.className = 'msg ' + role; d.textContent = text;
  $('#log').append(d); d.scrollIntoView(); return d;
}

async function loadList() {
  const rows = await (await api('/conversations')).json();
  $('#list').innerHTML = '';
  for (const c of rows) {
    const d = document.createElement('div');
    d.className = 'conv' + (c.id === current ? ' active' : '');
    d.textContent = c.title || '(empty)';
    d.onclick = () => open(c.id);
    $('#list').append(d);
  }
}

async function open(id) {
  current = id; $('#log').innerHTML = '';
  for (const m of await (await api(`/conversations/${id}/messages`)).json()) bubble(m.role, m.content);
  loadList();
}

$('#new').onclick = async () => { const { id } = await (await api('/conversations', { method: 'POST' })).json(); open(id); };

$('#f').onsubmit = async e => {
  e.preventDefault();
  if (!current) { const { id } = await (await api('/conversations', { method: 'POST' })).json(); current = id; }
  const content = $('#text').value; $('#text').value = '';
  bubble('user', content);
  const out = bubble('assistant');
  ctrl = new AbortController(); $('#send').hidden = true; $('#stop').hidden = false;
  try {
    const r = await api(`/conversations/${current}/messages`, {
      method: 'POST', headers: { 'content-type': 'application/json' }, signal: ctrl.signal,
      body: JSON.stringify({ content, provider: $('#provider').value, model: $('#model').value || null }),
    });
    const reader = r.body.pipeThrough(new TextDecoderStream()).getReader();
    for (let x; !(x = await reader.read()).done;) { out.textContent += x.value; out.scrollIntoView(); }
  } catch (err) {
    out.textContent += err.name === 'AbortError' ? ' [stopped]' : ` [error] ${err}`;
  } finally {
    $('#send').hidden = false; $('#stop').hidden = true; ctrl = null; loadList();
  }
};
$('#stop').onclick = () => ctrl && ctrl.abort();

$('#text').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#send').click(); } };
loadList();
</script>
</body>
</html>
