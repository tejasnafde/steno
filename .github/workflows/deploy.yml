# Push to main builds the image and publishes it to Artifact Registry. The VM pulls it on a timer
# (deploy/steno-pull.timer), so nothing here needs ssh access to the machine.
name: deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
env:
  IMAGE: us-central1-docker.pkg.dev/teejayproject/steno/app
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/974343814740/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: 974343814740-compute@developer.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
